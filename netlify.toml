[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/track/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://media.lazerzfine.com https://i.ytimg.com; media-src 'self' https://media.lazerzfine.com; connect-src 'self' https://media.lazerzfine.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    exclude = ["/sitemap.xml"]